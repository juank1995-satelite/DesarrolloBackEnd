<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Prueba Backend</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
</h:head>
<h:body>
    <div class="dashboard-layout">
        
        <!-- BARRA LATERAL (SIDEBAR) -->
        <div class="sidebar">
            <div class="sidebar-header">
                Prueba Backend
            </div>
            <div class="sidebar-subtitle">
                Navegación Principal
            </div>
            
            <h:form id="sidebar-form">
                <div class="sidebar-menu">
                    <!-- Opción 1: Lista Productos -->
                    <p:commandLink styleClass="sidebar-item #{not productBean.showForm ? 'active' : ''}" actionListener="#{productBean.showListView}" update=":mainPanel :sidebar-form" style="text-decoration: none;">
                        <i class="pi pi-list"></i> Lista Productos
                    </p:commandLink>
                    
                    <!-- Opción 2: Nuevo Producto (En Pantalla) -->
                    <p:commandLink styleClass="sidebar-item #{productBean.showForm ? 'active' : ''}" actionListener="#{productBean.showNewView}"
                                   update=":mainPanel :sidebar-form" style="text-decoration: none;">
                        <i class="pi pi-plus-circle"></i> Nuevo Producto
                    </p:commandLink>
                </div>
            </h:form>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="main-content">
            <div class="content-header">
                <h1>Dashboard</h1>
                <p>Resumen general de operaciones</p>
            </div>
            
            <!-- PANEL PRINCIPAL DINÁMICO -->
            <h:panelGroup id="mainPanel" layout="block">
            
            <!-- VISTA 1: TABLA DE PRODUCTOS -->
            <h:panelGroup rendered="#{not productBean.showForm}">
                <p:toolbar style="margin-bottom: 1rem; border: none; background: transparent; padding: 0;">
                    <p:toolbarGroup>
                        <p:commandButton value="Nuevo" icon="pi pi-plus" actionListener="#{productBean.openNew}"
                                         update=":dialogs:manage-product-content" oncomplete="PF('manageProductDialog').show()"
                                         styleClass="ui-button-success" style="margin-right: .5rem">
                            <p:resetInput target=":dialogs:manage-product-content" />
                        </p:commandButton>
                    </p:toolbarGroup>
                </p:toolbar>

            <!-- TARJETA CON LA TABLA -->
            <div class="dashboard-card">
                <h:form id="form">
                    <p:growl id="messages" showDetail="true" />

                    <p:dataTable id="dt-products" widgetVar="dtProducts" var="product" value="#{productBean.products}"
                                 reflow="true" styleClass="products-table"
                                 rowKey="#{product.id}" paginator="true" rows="10" paginatorPosition="bottom">

                        <p:column headerText="ID" sortBy="#{product.id}">
                            <h:outputText value="#{product.id}" />
                        </p:column>
                        
                        <p:column headerText="Nombre" sortBy="#{product.name}">
                            <h:outputText value="#{product.name}" />
                        </p:column>

                        <p:column headerText="Precio" sortBy="#{product.price}">
                            <h:outputText value="#{product.price}">
                                <f:convertNumber type="currency" currencySymbol="$" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Stock" sortBy="#{product.stock}">
                            <h:outputText value="#{product.stock}" />
                        </p:column>

                        <p:column exportable="false">
                            <p:commandButton icon="pi pi-pencil" update=":dialogs:manage-product-content"
                                             oncomplete="PF('manageProductDialog').show()"
                                             styleClass="edit-button rounded-button ui-button-success" process="@this"
                                             style="margin-right: 0.5rem;">
                                <f:setPropertyActionListener value="#{product}" target="#{productBean.selectedProduct}" />
                                <p:resetInput target=":dialogs:manage-product-content" />
                            </p:commandButton>
                            <p:commandButton class="ui-button-warning rounded-button" icon="pi pi-trash"
                                             process="@this" oncomplete="PF('deleteProductDialog').show()">
                                <f:setPropertyActionListener value="#{product}" target="#{productBean.selectedProduct}" />
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
            </h:panelGroup>

            <!-- VISTA 2: FORMULARIO EN PANTALLA (Premium Design) -->
            <h:panelGroup rendered="#{productBean.showForm}">
                <div class="dashboard-card" style="max-width: 800px; margin: 0 auto;">
                    <h2 style="margin-top: 0; color: var(--text-main); font-weight: 700;">Crear Nuevo Producto</h2>
                    <p style="color: #64748b; margin-bottom: 2rem;">Ingresa los detalles del producto a continuación.</p>
                    
                    <h:form id="inlineForm">
                        <p:outputPanel>
                            <div class="form-container">
                                <div class="field" style="margin-bottom: 1.5rem;">
                                    <p:outputLabel for="inlineName" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Nombre del Producto</p:outputLabel>
                                    <p:inputText id="inlineName" value="#{productBean.selectedProduct.name}" required="true" requiredMessage="El nombre del producto es obligatorio" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #cbd5e1;" placeholder="Ej. Taladro Eléctrico" />
                                </div>
                                <div class="field" style="margin-bottom: 1.5rem;">
                                    <p:outputLabel for="inlineDesc" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Descripción (Opcional)</p:outputLabel>
                                    <p:inputTextarea id="inlineDesc" value="#{productBean.selectedProduct.description}" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #cbd5e1;" rows="4" placeholder="Si la dejas en blanco, se generará una automáticamente desde FakeStoreAPI" />
                                </div>
                                <div style="display: flex; gap: 1.5rem; margin-bottom: 1.5rem;">
                                    <div class="field" style="flex: 1;">
                                        <p:outputLabel for="inlinePrice" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Precio</p:outputLabel>
                                        <p:inputNumber id="inlinePrice" value="#{productBean.selectedProduct.price}" required="true" requiredMessage="El precio es obligatorio" symbol=" $" symbolPosition="s" decimalSeparator="." thousandSeparator="," minValue="0" style="width: 100%;" inputStyle="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #cbd5e1;" placeholder="0.00" />
                                    </div>
                                    <div class="field" style="flex: 1;">
                                        <p:outputLabel for="inlineStock" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Stock Inicial</p:outputLabel>
                                        <p:spinner id="inlineStock" value="#{productBean.selectedProduct.stock}" min="0" required="true" requiredMessage="El stock es obligatorio" style="width: 100%; display: block;" />
                                    </div>
                                </div>
                            </div>
                            
                            <div style="margin-top: 2.5rem; display: flex; gap: 1rem; justify-content: flex-end; padding-top: 1.5rem; border-top: 1px solid #e2e8f0;">
                                <p:commandButton value="Cancelar" icon="pi pi-times" actionListener="#{productBean.showListView}"
                                                 update=":mainPanel" process="@this" styleClass="ui-button-secondary ui-button-flat" immediate="true" style="width: auto; padding: 0.5rem 1rem; font-weight: 600;" />
                                <p:commandButton value="Guardar Producto" icon="pi pi-check" actionListener="#{productBean.saveProduct}"
                                                 update=":mainPanel :form:messages" process="@form" styleClass="ui-button-primary" style="width: auto; padding: 0.5rem 1.5rem; font-weight: 600; border-radius: 6px;" />
                            </div>
                        </p:outputPanel>
                    </h:form>
                </div>
            </h:panelGroup>
            
            </h:panelGroup>
        </div>

        <!-- DIÁLOGOS MODALES (NUEVO/EDITAR Y ELIMINAR) -->
        <h:form id="dialogs">
            <p:dialog header="Detalles del Producto" showEffect="fade" modal="true" widgetVar="manageProductDialog"
                      responsive="true">
                <p:outputPanel id="manage-product-content" class="ui-fluid">
                    <p:outputPanel rendered="#{not empty productBean.selectedProduct}">
                        <div class="field">
                            <p:outputLabel for="name">Nombre</p:outputLabel>
                            <p:inputText id="name" value="#{productBean.selectedProduct.name}" required="true" requiredMessage="El nombre del producto es obligatorio" />
                        </div>
                        <div class="field">
                            <p:outputLabel for="description">Descripción</p:outputLabel>
                            <p:inputTextarea id="description" value="#{productBean.selectedProduct.description}" />
                        </div>
                        <div class="formgrid grid">
                            <div class="field col">
                                <p:outputLabel for="price">Precio</p:outputLabel>
                                <p:inputNumber id="price" value="#{productBean.selectedProduct.price}" required="true" requiredMessage="El precio es obligatorio" symbol=" $"
                                               symbolPosition="s" decimalSeparator="." thousandSeparator="," minValue="0" />
                            </div>
                            <div class="field col">
                                <p:outputLabel for="stock">Stock</p:outputLabel>
                                <p:spinner id="stock" value="#{productBean.selectedProduct.stock}" required="true" requiredMessage="El stock es obligatorio" min="0" />
                            </div>
                        </div>
                    </p:outputPanel>
                </p:outputPanel>

                <f:facet name="footer">
                    <p:commandButton value="Guardar" icon="pi pi-check" actionListener="#{productBean.saveProduct}"
                                     update="manage-product-content :form:dt-products :form:messages" process="manage-product-content @this" />
                    <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('manageProductDialog').hide()"
                                     class="ui-button-secondary" type="button" />
                </f:facet>
            </p:dialog>

            <p:confirmDialog widgetVar="deleteProductDialog" showEffect="fade" width="300"
                             message="¿Eliminar el producto?" header="Confirmación" severity="warn">
                <p:commandButton value="Sí" icon="pi pi-check" actionListener="#{productBean.deleteProduct}"
                                 process="@this" update=":form:messages :form:dt-products"
                                 oncomplete="PF('deleteProductDialog').hide()" />
                <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="pi pi-times"
                                 onclick="PF('deleteProductDialog').hide()" />
            </p:confirmDialog>
        </h:form>
    </div>
</h:body>
</html>
